name: 3rd-test Deploy to Yituliu

on:
  workflow_dispatch:
  push:
    branches: [ark-endfield-3rd-test]
    paths:
      - "src/**"

jobs:
  build:
    environment: yituliu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build -- -c=production

      - name: Copy index to 404
        run: cp dist/browser/index.html dist/browser/404.html

      - name: Write release info
        uses: actions/github-script@v8
        env:
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const exitCode = await exec.exec('./scripts/write-release-info.sh',[
              `3rd-test-${process.env.COMMIT_SHA.substring(0, 7)}`,
              'ark-endfield-3rd-test',
              (new Date()).toISOString(),
              'unused-tag',
            ]);

            console.log('Write release info: ' + exitCode);

      - name: Setup COS CLI
        run: |
          wget -O ./coscli https://github.com/tencentyun/coscli/releases/download/v1.0.7/coscli-v1.0.7-linux-amd64
          chmod 755 ./coscli
          ./coscli --version

      - name: Upload to COS
        if: env.DEPLOY == 'true'
        run: |
          ./coscli sync ./dist/browser cos://${{ secrets.COS_BUCKET_NAME }}/ --recursive --delete --force --init-skip=true --secret-id=${{ secrets.COS_SECRET_ID }} --secret-key=${{ secrets.COS_SECRET_KEY }} --endpoint=cos.${{ secrets.COS_REGION }}.myqcloud.com