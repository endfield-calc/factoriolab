name: 3rd-test Deploy

on:
  workflow_dispatch:
    inputs:
      should_deploy_to_gh_pages:
        description: Deploy To Github Pages
        type: boolean
        required: true
        default: false
      should_deploy_to_yituliu:
        description: Deploy To Yituliu
        type: boolean
        required: true
        default: false
  push:
    branches: [ark-endfield-3rd-test]
    paths:
      - "src/**"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build -- -c=production

      - name: Copy index to 404
        run: cp dist/browser/index.html dist/browser/404.html

      - name: Write release info
        uses: actions/github-script@v8
        env:
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const exitCode = await exec.exec('./scripts/write-release-info.sh',[
              `3rd-test-${process.env.COMMIT_SHA.substring(0, 7)}`,
              'ark-endfield-3rd-test',
              (new Date()).toISOString(),
              'unused-tag',
            ]);
            if (exitCode) {
              core.setFailed('Write release info exit code: ' + exitCode);
            }

      - id: upload-artifact
        name: Upload Internal Artifact
        uses: actions/upload-artifact@v5
        with:
          name: build-result
          path: dist/browser
          retention-days: 1

  deploy-gh-pages:
    needs: build
    if: github.event_name == 'push' || inputs.should_deploy_to_gh_pages == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.PUBLISH_TOKEN }}

      - name: Download Build Artifact
        uses: actions/download-artifact@v6
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/browser

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.PUBLISH_TOKEN }}
          repository-name: endfield-calc/endfield-calc.github.io
          branch: master
          git-config-name: "github-actions[bot]"
          git-config-email: "41898282+github-actions[bot]@users.noreply.github.com"
          folder: dist/browser
          clean: true

  deploy-yituliu:
    needs: build
    if: github.event_name == 'push' || inputs.should_deploy_to_yituliu == true
    runs-on: ubuntu-latest
    environment: yituliu
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v6
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/browser

      - name: Cache coscli
        id: cache-coscli
        uses: actions/cache/restore@v4
        with:
          path: ./coscli
          key: coscli-v1.0.7-linux-amd64

      - name: Download COS CLI
        if: ${{ steps.cache-coscli.outputs.cache-hit != 'true' }}
        run: |
          wget -O ./coscli https://github.com/tencentyun/coscli/releases/download/v1.0.7/coscli-v1.0.7-linux-amd64
          chmod 755 ./coscli

      - name: Save coscli to cache
        if: ${{ steps.cache-coscli.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ./coscli
          key: coscli-v1.0.7-linux-amd64

      - name: Deploy to COS
        run: |
          ./coscli --version
          ./coscli sync ./dist/browser cos://${{ secrets.COS_BUCKET_NAME }}/ --recursive --delete --force --init-skip=true --secret-id=${{ secrets.COS_SECRET_ID }} --secret-key=${{ secrets.COS_SECRET_KEY }} --endpoint=cos.${{ secrets.COS_REGION }}.myqcloud.com

      - name: Setup Python
        uses: actions/setup-python@v6

      - name: Install Tencent CLI
        run: |
          pip install tccli
          tccli --version

      - name: Refresh CDN
        run: tccli cdn PurgePathCache --secretId ${{ secrets.COS_SECRET_ID }} --secretKey ${{ secrets.COS_SECRET_KEY }} --FlushType 'flush' --Paths '["https://factory.ef.yituliu.cn/"]'

  delete-artifact:
    needs: [build, deploy-gh-pages, deploy-yituliu]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete Artifact
        uses: actions/github-script@v8
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        with:
          script: |
            github.rest.actions.deleteArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: process.env.ARTIFACT_ID
            });

