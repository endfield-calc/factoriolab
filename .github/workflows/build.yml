name: build
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '*.json'
      - '*.js'
      - '*.ts'
      - '.postcssrc.json'
      - '.prettier*'
      - '.stylelint*'
  workflow_dispatch:
    inputs:
      should_deploy_to_gh_pages:
        description: Deploy to GitHub Pages
        type: boolean
        required: true
        default: false
      should_deploy_to_yituliu:
        description: Deploy to Yituliu
        type: boolean
        required: true
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-artifact: ${{ steps.pages.outputs.artifact-id }}
      yituliu-artifact: ${{ steps.yituliu.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier
        run: npm run prettier

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

      - name: Run delivery tests
        run: |
          git fetch --no-tags --depth=1 https://github.com/endfield-calc/factoriolab.git 26a49e814f0570e050a19b726b3ba689d282aa3b
          npm run test:delivery

      - name: Run build
        run: npm run build

      - name: Prepare and verify both sites
        run: npm run package:sites

      - id: pages
        uses: actions/upload-artifact@v4
        with:
          name: endfield-pages
          path: dist/endfield-sites/pages
          retention-days: 1

      - id: yituliu
        uses: actions/upload-artifact@v4
        with:
          name: endfield-yituliu
          path: dist/endfield-sites/yituliu
          retention-days: 1

  deploy-pages:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.should_deploy_to_gh_pages == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: endfield-pages
          path: dist/endfield-sites/pages

      - name: Deploy to project Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.PUBLISH_TOKEN }}
          repository-name: endfield-calc/endfield-calc.github.io
          branch: master
          folder: dist/endfield-sites/pages
          clean: true

  deploy-yituliu:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.should_deploy_to_yituliu == true
    runs-on: ubuntu-latest
    environment: yituliu
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: endfield-yituliu
          path: dist/endfield-sites/yituliu

      - name: Cache COS CLI
        id: cache-coscli
        uses: actions/cache@v4
        with:
          path: .tmp/coscli
          key: coscli-v1.0.7-linux-amd64

      - name: Download COS CLI
        if: steps.cache-coscli.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tmp
          wget -O .tmp/coscli https://github.com/tencentyun/coscli/releases/download/v1.0.7/coscli-v1.0.7-linux-amd64
          chmod 755 .tmp/coscli

      - name: Deploy to COS
        run: |
          ./.tmp/coscli --version
          ./.tmp/coscli sync ./dist/endfield-sites/yituliu cos://${{ secrets.COS_BUCKET_NAME }}/ --recursive --delete --force --part-size=1 --routines=5 --fail-output-path=/dev/stderr --retry-num=5 --err-retry-num=10 --init-skip=true --secret-id=${{ secrets.COS_SECRET_ID }} --secret-key=${{ secrets.COS_SECRET_KEY }} --endpoint=cos.${{ secrets.COS_REGION }}.myqcloud.com

      - name: Setup Python
        uses: actions/setup-python@v5

      - name: Install Tencent CLI
        run: pip install tccli

      - name: Refresh CDN
        run: tccli cdn PurgePathCache --secretId ${{ secrets.COS_SECRET_ID }} --secretKey ${{ secrets.COS_SECRET_KEY }} --FlushType 'flush' --Paths '["https://factory.ef.yituliu.cn/"]'

  clean-pages-artifact:
    needs: [build, deploy-pages]
    if: needs.deploy-pages.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.pages-artifact }}
        with:
          script: |
            await github.rest.actions.deleteArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: Number(process.env.ARTIFACT_ID),
            });

  clean-yituliu-artifact:
    needs: [build, deploy-yituliu]
    if: needs.deploy-yituliu.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.yituliu-artifact }}
        with:
          script: |
            await github.rest.actions.deleteArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: Number(process.env.ARTIFACT_ID),
            });
