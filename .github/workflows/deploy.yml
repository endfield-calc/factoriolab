name: Deploy

on:
  workflow_dispatch:
    inputs:
      should_deploy_to_gh_pages:
        description: Deploy To Github Pages
        type: boolean
        required: true
        default: false
      should_deploy_to_yituliu:
        description: Deploy To Yituliu
        type: boolean
        required: true
        default: false
  push:
    branches: [ark-endfield-3rd-test]
    paths:
      - "src/**"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
      artifact-id-zh: ${{ steps.upload-artifact-zh.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build -- -c=production

      - name: Copy files
        run: |
          cp dist/browser/index.html dist/browser/404.html
          cp resource/webmanifest/site.webmanifest dist/browser/site.webmanifest

      - name: Write release info
        uses: actions/github-script@v8
        env:
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const exitCode = await exec.exec('./scripts/write-release-info.sh',[
              `v1.0-${process.env.COMMIT_SHA.substring(0, 7)}`,
              'ark-endfield',
              (new Date()).toISOString(),
              'unused-tag',
            ]);
            if (exitCode) {
              core.setFailed('Write release info exit code: ' + exitCode);
            }

      - id: upload-artifact
        name: Upload Internal Artifact
        uses: actions/upload-artifact@v5
        with:
          name: build-result
          path: dist/browser
          retention-days: 1

      - name: Update Chinese index and manifest
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const basePath = './dist/browser/';

            // 定义文件路径和新内容
            const [I, I2, T] = [`${basePath}/index.html`, `${basePath}/404.html`, '终末地量化计算器'];

            // 1. 更新 index.html 和 404.html (替换 <title>...</title> 标签内的内容)
            // 使用 [\s\S]*? 匹配任何内容（包括换行），实现非贪婪替换
            fs.writeFileSync(I, fs.readFileSync(I, 'utf8')
              .replace(/<title>[\s\S]*?<\/title>/, `<title>${T}</title>`), 'utf8');
            fs.writeFileSync(I2, fs.readFileSync(I2, 'utf8')
              .replace(/<title>[\s\S]*?<\/title>/, `<title>${T}</title>`), 'utf8');

            fs.copyFileSync('resource/webmanifest/site-zh.webmanifest', `${basePath}/site.webmanifest`);

            // 重新计算文件hash
            const exitCode = await exec.exec('npm run ngsw-config');
            if (exitCode) {
              core.setFailed('Write release info exit code: ' + exitCode);
            }

      - id: upload-artifact-zh
        name: Upload Internal Artifact
        uses: actions/upload-artifact@v5
        with:
          name: build-result-zh
          path: dist/browser
          retention-days: 1

  deploy-gh-pages:
    needs: build
    if: github.event_name == 'push' || inputs.should_deploy_to_gh_pages == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.PUBLISH_TOKEN }}

      - name: Download Build Artifact
        uses: actions/download-artifact@v6
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/browser

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.PUBLISH_TOKEN }}
          repository-name: endfield-calc/endfield-calc.github.io
          branch: master
          git-config-name: "github-actions[bot]"
          git-config-email: "41898282+github-actions[bot]@users.noreply.github.com"
          folder: dist/browser
          clean: true

  deploy-yituliu:
    needs: build
    if: github.event_name == 'push' || inputs.should_deploy_to_yituliu == true
    runs-on: ubuntu-latest
    environment: yituliu
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v6
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id-zh }}
          path: dist/browser

      - name: Cache coscli
        id: cache-coscli
        uses: actions/cache/restore@v4
        with:
          path: ./coscli
          key: coscli-v1.0.7-linux-amd64

      - name: Download COS CLI
        if: ${{ steps.cache-coscli.outputs.cache-hit != 'true' }}
        run: |
          wget -O ./coscli https://github.com/tencentyun/coscli/releases/download/v1.0.7/coscli-v1.0.7-linux-amd64
          chmod 755 ./coscli

      - name: Save coscli to cache
        if: ${{ steps.cache-coscli.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ./coscli
          key: coscli-v1.0.7-linux-amd64

      - name: Deploy to COS
        run: |
          ./coscli --version
          ./coscli sync ./dist/browser cos://${{ secrets.COS_BUCKET_NAME }}/ --recursive --delete --force --part-size=1 --routines=5 --fail-output-path=/dev/stderr --retry-num=5 --err-retry-num=10 --init-skip=true --secret-id=${{ secrets.COS_SECRET_ID }} --secret-key=${{ secrets.COS_SECRET_KEY }} --endpoint=cos.${{ secrets.COS_REGION }}.myqcloud.com

      - name: Setup Python
        uses: actions/setup-python@v6

      - name: Install Tencent CLI
        run: |
          pip install tccli
          tccli --version

      - name: Refresh CDN
        run: tccli cdn PurgePathCache --secretId ${{ secrets.COS_SECRET_ID }} --secretKey ${{ secrets.COS_SECRET_KEY }} --FlushType 'flush' --Paths '["https://factory.ef.yituliu.cn/"]'

  clean-artifact:
    needs: [build, deploy-gh-pages, deploy-yituliu]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete Artifact
        uses: actions/github-script@v8
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          ARTIFACT_ID_ZH: ${{ needs.build.outputs.artifact-id-zh }}
        with:
          script: |
            github.rest.actions.deleteArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: process.env.ARTIFACT_ID
            });
            github.rest.actions.deleteArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: process.env.ARTIFACT_ID_ZH
            });

