<table class="lab-table">
  <tbody>
    @for (key of costKeys; track $index) {
      @let id = 'cost-' + key;
      <tr>
        <th [id]="id">{{ 'costs.' + key | translate }}</th>
        <td>
          <lab-input-number
            [labelledBy]="id"
            [labTooltip]="'costs.' + key + 'Tooltip'"
            labTooltipPosition="adjacent"
            [buttons]="true"
            [step]="rational(10)"
            stepType="multiply"
            [minimum]="undefined"
            [ngModel]="editValue()[key]"
            (ngModelChange)="apply(key, $event)"
          ></lab-input-number>
        </td>
      </tr>
    }
  </tbody>
</table>
<lab-form-field label="endfield.electric.title">
  <lab-input-number
    [buttons]="true"
    [minimum]="rational.zero"
    [value]="editElectric()"
    (valueChange)="applyElectric($event)"
  ></lab-input-number>
</lab-form-field>
<p>{{ 'endfield.electric.description' | translate }}</p>

<div class="gap-1 sm:gap-2 flex justify-end">
  @if (modified()) {
    <button
      type="button"
      labButton
      text="reset"
      [faIcon]="faRotateLeft"
      (click)="reset()"
    ></button>
  }
  <button
    type="button"
    labButton
    color="brand"
    text="ok"
    [faIcon]="faCheck"
    (click)="save()"
  ></button>
  <button
    type="button"
    labButton
    text="cancel"
    [faIcon]="faXmark"
    (click)="dialogRef.close()"
  ></button>
</div>
