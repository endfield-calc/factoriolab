<lab-form-field label="endfield.electric.title">
  <lab-input-number
    [buttons]="true"
    [disabled]="!coordinator.ready()"
    [value]="value()"
    (valueChange)="updateValue($event)"
  ></lab-input-number>
</lab-form-field>
<p>{{ 'endfield.electric.description' | translate }}</p>

<button
  type="button"
  labButton
  text="endfield.electric.apply"
  [disabled]="!coordinator.ready() || value().eq(coordinator.state().electric)"
  (click)="coordinator.dispatch({ type: 'electric', value: value() })"
></button>
